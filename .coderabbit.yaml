# CodeRabbit configuration for the blogcastAI/ableplayer fork.
# Fork-local file: not intended for upstream PRs.
# Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
  path_instructions:
    - path: "scripts/**/*.js"
      instructions: |
        This is an accessibility-first media player (WCAG 2.2, WAI-ARIA).
        Prioritize: keyboard operability regressions, focus management,
        ARIA attribute correctness, screen-reader announcement behavior,
        and jQuery-removal readiness (flag new jQuery API usage that has
        a straightforward vanilla-DOM equivalent). The project targets
        broad browser support; flag syntax newer than ES2020.
    - path: "scripts/__tests__/**"
      instructions: |
        Test expansion is the maintainer's stated top priority. Suggest
        additional cases where coverage is thin rather than nitpicking
        style.
chat:
  auto_reply: true
